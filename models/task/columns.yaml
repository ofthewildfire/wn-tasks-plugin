# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: 'ofthewildfire.tasks::lang.models.general.id'
        searchable: true
    title:
        label: Task Name
        sortable: true
        searchable: true
    assignee:
        label: Assignee
        relation: assignee
        select: name
    creator:
        label: Task Creator
        relation: creator
        select: "CONCAT(first_name, ' ', last_name)"
    due_date:
        label: Due Date
        type: date
        format: M j, Y
    created_at:
        label: 'ofthewildfire.tasks::lang.models.general.created_at'
        type: datetime
        searchable: true
        sortable: true
        invisible: true
    updated_at:
        label: 'ofthewildfire.tasks::lang.models.general.updated_at'
        type: datetime
        searchable: true
        sortable: true
